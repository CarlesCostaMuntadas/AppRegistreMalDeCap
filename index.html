<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre d'hàbits i de mal de cap</title>
    
    <!-- Llibreria oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Estils externs -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        
        <!-- Missatges d'avís visuals (Verd / Vermell) -->
        <div id="toast-message" class="toast hidden"></div>

        <!-- Pantalla de Login / Registre -->
        <div id="login-container" class="card auth-card">
            <div class="auth-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <h2>Accés Privat</h2>
            <p>Inicia sessió o crea un compte nou per gestionar els teus registres de manera segura.</p>
            
            <form id="formLogin" class="auth-form">
                <div class="field">
                    <label for="loginEmail">Correu electrònic</label>
                    <div class="input-with-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input type="email" id="loginEmail" placeholder="nom@correu.com" required>
                    </div>
                </div>
                <div class="field">
                    <label for="loginPassword">Contrasenya</label>
                    <div class="input-with-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <input type="password" id="loginPassword" placeholder="Mínim 6 caràcters" required minlength="6">
                    </div>
                </div>
                <div class="auth-buttons">
                    <button type="submit" id="btnLoginSubmit" class="primary">Iniciar sessió</button>
                    <button type="button" id="btnSignUpSubmit" class="secondary-outline">Crear compte</button>
                </div>
            </form>
        </div>

        <!-- Aplicació principal -->
        <div id="app-container" class="hidden app-layout">
            
            <header class="app-header">
                <div class="status-bar" id="statusBar">
                    <span class="status-dot"></span> Connectat segur
                </div>
                <div class="header-actions">
                    <button id="btnDownloadCsv" class="icon-text-btn" title="Descarregar dades en CSV">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        Baixar CSV
                    </button>
                    <button id="btnLogout" class="icon-text-btn danger-text" title="Tancar sessió">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                        Sortir
                    </button>
                </div>
            </header>

            <!-- Botons superiors per alternar entre panells -->
            <div class="panel-nav">
                <button class="nav-btn active" id="btnNavEsdeveniment" onclick="mostrarPanell('esdeveniment')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                    Esdeveniment
                </button>
                <button class="nav-btn" id="btnNavMalDeCap" onclick="mostrarPanell('malDeCap')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
                    Mal de cap
                </button>
            </div>

            <!-- Panell / Formulari Esdeveniment -->
            <form class="card" id="formEsdeveniment">
                <div class="field">
                    <label for="dataEsdeveniment">Data i Hora</label>
                    <input type="datetime-local" id="dataEsdeveniment" required>
                </div>

                <div class="field">
                    <label for="inputEsdeveniment">Aliment o activitat</label>
                    <input type="text" id="inputEsdeveniment" placeholder="Ex: cafè, patata, vinagre, ioga..." list="llistaEsdeveniments" autocomplete="off" required>
                    <datalist id="llistaEsdeveniments">
                        <option value="Cafè">
                        <option value="Patata">
                        <option value="Ioga">
                    </datalist>
                </div>

                <div class="field">
                    <label for="obsEsdeveniment">Observacions (Opcional)</label>
                    <textarea id="obsEsdeveniment" placeholder="Ex: quantitat, intensitat..."></textarea>
                </div>

                <button type="submit" class="primary">Desar aliment/activitat</button>
            </form>

            <!-- Panell / Formulari Mal de cap -->
            <form class="card hidden" id="formMalDeCap">
                <div class="field">
                    <label for="dataMalDeCap">Data i Hora</label>
                    <input type="datetime-local" id="dataMalDeCap" required>
                </div>

                <div class="row">
                    <div class="field">
                        <label for="inputTipus">Tipus</label>
                        <input type="text" id="inputTipus" placeholder="Escull o escriu..." list="llistaTipusMalDeCap" autocomplete="off" required>
                        <datalist id="llistaTipusMalDeCap">
                            <option value="Tensional">
                            <option value="Cervicàlgia (espleni)">
							<option value="Pressió cranial">
							<option value="Palpitant">
                            <option value="Migranya amb aura">
							<option value="Migranya sense aura">
                        </datalist>
                    </div>
                    <div class="field">
                        <label for="selectIntensitat">Intensitat</label>
                        <select id="selectIntensitat">
                            <option value="Lleuger">Lleuger</option>
                            <option value="Moderat" selected>Moderat</option>
                            <option value="Sever">Sever</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <div class="checkbox-field">
                        <input type="checkbox" id="checkMedicacio">
                        <label for="checkMedicacio">He pres medicació</label>
                    </div>
                </div>

                <div class="field">
                    <label for="obsMalDeCap">Observacions (Opcional)</label>
                    <textarea id="obsMalDeCap" placeholder="Ex: Nom del medicament, part del cap..."></textarea>
                </div>

                <button type="submit" class="primary">Desar mal de cap</button>
            </form>
        </div>
    </div>

    <!-- Peu de pàgina -->
    <footer>
        <a href="https://www.carlescosta.cat" target="_blank" rel="noopener">Carles Costa i Muntadas</a> - Registre mal de cap
    </footer>

    <!-- Lògica JavaScript externa -->
    <script src="script.js"></script>
</body>
</html>
